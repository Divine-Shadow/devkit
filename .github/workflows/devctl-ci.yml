name: Native Runtime Gates

on:
  push:
    paths:
      - '.github/workflows/devctl-ci.yml'
      - 'Makefile'
      - 'README.md'
      - 'flake.lock'
      - 'flake.nix'
      - 'brokers/postgres-broker/**'
      - 'cli/devctl/**'
      - 'kit/docs/**'
      - 'kit/scripts/**'
      - 'nix/**'
      - 'overlays/**'
  pull_request:
    paths:
      - '.github/workflows/devctl-ci.yml'
      - 'Makefile'
      - 'README.md'
      - 'flake.lock'
      - 'flake.nix'
      - 'brokers/postgres-broker/**'
      - 'cli/devctl/**'
      - 'kit/docs/**'
      - 'kit/scripts/**'
      - 'nix/**'
      - 'overlays/**'

jobs:
  cheap-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CI-only dry-run fixture: runtime-matrix checks the configured sibling
      # path exists here, while production admission still requires the real
      # repository and its normal source-derived runtime.
      - name: Materialize dry-run Terraform sibling fixture
        run: mkdir -p "$RUNNER_WORKSPACE/ouroboros-terraform"
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: cli/devctl/go.sum
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cheap native runtime gates
        shell: bash
        run: |
          set -o pipefail
          log="$(mktemp)"
          if make ci-cheap 2>&1 | tee "$log"; then
            exit 0
          else
            status="${PIPESTATUS[0]}"
          fi
          sanitize_log() {
            sed -E $'s/\x1B\\[[0-?]*[ -\\/]*[@-~]//g' | tr '\r' '\n' | \
              grep -vE '^(Receiving objects:|Resolving deltas:|remote: |[[:space:]]*[0-9]+%)' || true
          }
          focused="$(sanitize_log < "$log" | grep -E -i -B 3 -A 15 -- '(^--- FAIL|FAIL|error|missing|invalid|refused|make.*\*\*\*|runtime matrix)' | tail -n 24 || true)"
          terminal="$(sanitize_log < "$log" | tail -n 30 || true)"
          if [[ -z "$focused" ]]; then
            focused="$terminal"
          else
            focused="$focused
          -- terminal log --
          $terminal"
          fi
          # GitHub annotations have a bounded payload. Retain the terminal
          # bytes so the actual failing command cannot be displaced by an
          # earlier broad match such as the runtime-matrix heading.
          focused="${focused: -6000}"
          annotation="$(printf '%s' "$focused" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':join;N;$!b join;s/\n/%0A/g')"
          printf '::error title=ci-cheap failure::%s\n' "$annotation"
          exit "$status"

  postgres-broker-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Postgres broker container smoke
        run: make postgres-broker-container-smoke

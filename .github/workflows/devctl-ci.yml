name: Native Runtime Gates

on:
  push:
    paths:
      - '.github/workflows/devctl-ci.yml'
      - 'Makefile'
      - 'README.md'
      - 'flake.lock'
      - 'flake.nix'
      - 'brokers/postgres-broker/**'
      - 'cli/devctl/**'
      - 'kit/docs/**'
      - 'kit/scripts/**'
      - 'nix/**'
      - 'overlays/**'
  pull_request:
    paths:
      - '.github/workflows/devctl-ci.yml'
      - 'Makefile'
      - 'README.md'
      - 'flake.lock'
      - 'flake.nix'
      - 'brokers/postgres-broker/**'
      - 'cli/devctl/**'
      - 'kit/docs/**'
      - 'kit/scripts/**'
      - 'nix/**'
      - 'overlays/**'

jobs:
  cheap-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cheap native runtime gates
        run: make ci-cheap

  postgres-broker-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Postgres broker container smoke
        run: make postgres-broker-container-smoke

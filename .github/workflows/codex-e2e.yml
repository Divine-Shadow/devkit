name: Codex E2E

on:
  push:
    paths:
      - 'Makefile'
      - 'flake.lock'
      - 'flake.nix'
      - 'brokers/postgres-broker/**'
      - 'cli/devctl/**'
      - 'kit/**'
      - 'nix/**'
      - 'overlays/**'
      - '.github/workflows/codex-e2e.yml'
  pull_request:
    paths:
      - 'Makefile'
      - 'flake.lock'
      - 'flake.nix'
      - 'brokers/postgres-broker/**'
      - 'cli/devctl/**'
      - 'kit/**'
      - 'nix/**'
      - 'overlays/**'
      - '.github/workflows/codex-e2e.yml'

jobs:
  e2e:
    if: ${{ vars.DEVKIT_RUN_CODEX_E2E == 'true' }}
    runs-on: ubuntu-latest
    env:
      DEVKIT_NO_TMUX: '1'
      DOCKER_BUILDKIT: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build CLI
        run: make build-cli
      - name: Native runtime smoke
        run: make native-runtime-smoke
      - name: Native readiness audit
        run: make native-readiness-audit
      - name: Teardown
        if: always()
        run: kit/scripts/devkit -p dev-all down --repo ouroboros-ide --count 2 --format json || true

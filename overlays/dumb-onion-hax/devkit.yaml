workspace: ../../../dumb-onion-hax
service: dev-agent
defaults:
  repo: dumb-onion-hax
  agents: 1
  base_branch: main
  branch_prefix: agent
runtime:
  flake: ./overlays/dumb-onion-hax#default
  codex_version: 0.133.0
  core_check: sbt compile
  notes: Scala/SBT runtime for dumb-onion-hax.
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker java sbt aws python3; do
          command -v "$tool" >/dev/null
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: sbt-jvm
      command: java -version >/dev/null 2>&1 && command -v sbt >/dev/null
  repo_checks:
    - name: core-check
      command: sbt compile
env:
  PATH: /workspace/.local/bin:${PATH}
hooks:
  warm: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    sbt -v update
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    sbt compile

workspace: ../../../pokeemerald
service: dev-agent
defaults:
  repo: pokeemerald
  agents: 1
  base_branch: main
  branch_prefix: agent
runtime:
  flake: .#pokeemerald
  codex_version: 0.130.0
  core_check: make modern
  notes: GBA build workspace; current warm hook is intentionally no-op.
env:
  PATH: /workspace/.local/bin:${PATH}
hooks:
  warm: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    echo "no-op"
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    echo "no-op"

workspace: ../../../pokeemerald
service: dev-agent
defaults:
  repo: pokeemerald
  agents: 1
  base_branch: master
  branch_prefix: agent
runtime:
  flake: ./overlays/pokeemerald#default
  codex_version: 0.144.0
  core_check: make modern
  notes: GBA build workspace; current warm hook is intentionally no-op.
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker make arm-none-eabi-gcc arm-none-eabi-as mgba-headless; do
          command -v "$tool" >/dev/null
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: gba-toolchain
      command: arm-none-eabi-gcc --version >/dev/null && arm-none-eabi-as --version >/dev/null && mgba-headless --help 2>&1 | grep -q -- --script
  repo_checks:
    - name: core-check
      command: make modern
env:
  PATH: /workspace/.local/bin:${PATH}
hooks:
  warm: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    echo "no-op"
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    echo "no-op"

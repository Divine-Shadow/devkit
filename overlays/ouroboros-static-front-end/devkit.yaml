workspace: ../../../ouroboros-static-front-end
service: frontend
defaults:
  repo: ouroboros-static-front-end
  agents: 1
  base_branch: main
  branch_prefix: agent
runtime:
  flake: ./overlays/ouroboros-static-front-end#default
  codex_version: 0.130.0
  core_check: npm run build
  notes: Node/Gatsby image for the standalone static front end.
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker node npm purs spago netlify deno playwright; do
          command -v "$tool" >/dev/null
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: frontend-tooling
      command: node --version >/dev/null && npm --version >/dev/null && purs --version >/dev/null && spago --version >/dev/null && netlify --version >/dev/null && deno --version >/dev/null
    - name: playwright-cli
      command: playwright --version >/dev/null && node -e 'require("@playwright/test")'
  repo_checks:
    - name: core-check
      command: npm run build
env:
  NODE_ENV: development
  GATSBY_TELEMETRY_DISABLED: "1"
  PATH: /workspace/.local/bin:${PATH}
hooks:
  # Install dependencies so local gatsby binary is available via npm scripts
  warm: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    npm ci
  # Optional: produce a production build during maintenance
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    npm run build

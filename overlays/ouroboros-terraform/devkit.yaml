workspace: ../../../ouroboros-terraform
service: dev-agent
defaults:
  repo: ouroboros-terraform
  origin: ssh://git@ssh.github.com:443/Divine-Shadow/ouroboros-terraform.git
  agents: 1
  base_branch: main
  branch_prefix: agent
runtime:
  flake: ./overlays/ouroboros-terraform#default
  flake_input_overrides:
    ouroboros-terraform: ../ouroboros-terraform
  codex_version: 0.160.0
  core_check: terraform fmt -check -recursive
  notes: Thin devkit adapter; canonical tool requirements live in ../ouroboros-terraform/flake.nix and devkit.yaml, and devkit must pass the ouroboros-terraform flake input override explicitly.
native:
  # This is an admitted package-native overlay.  Immutable package discovery
  # supplies runtime authority only; mutable consumer geometry stays explicit.
  host_root: /home/bayesartre/dev
  worktree_root: /home/bayesartre/dev/agent-worktrees
  state_root: /home/bayesartre/dev/.devkit/native-agents
  worktree_container_root: /workspaces/dev/agent-worktrees
  state_container_root: /agent-state
  required_isolation_profile: workspace-egress
  isolation_profiles:
    workspace-egress:
      filesystem: workspace-only
      egress_allowlist: ../../kit/proxy/allowlist.txt
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker codex; do
          command -v "$tool" >/dev/null || { echo "missing required runtime tool: $tool" >&2; exit 127; }
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: terraform-packer-aws
      command: |
        # Readiness precedes the app-server wrapper. Enter only the declared
        # Terraform child environment; keep native GUI Codex checks outside it.
        python3 - <<'PYTOOLS'
        import os
        import pathlib
        import re
        import subprocess

        wrapper = pathlib.Path("/run/current-system/sw/bin/ouro-terra-runtime")
        source = wrapper.resolve(strict=True)
        if not str(source).startswith("/nix/store/") or not source.is_file():
            raise SystemExit("Terraform readiness requires the immutable selected runtime")
        declarations = re.findall(r'^export PATH="([^"\n]+)"$', source.read_text(), re.M)
        if len(declarations) != 1:
            raise SystemExit("Terraform runtime must declare one closed immutable tool path")
        directories = declarations[0].split(":")
        if not directories or any(not d.startswith("/nix/store/") or d != os.path.normpath(d) for d in directories):
            raise SystemExit("Terraform runtime contains a noncanonical tool path")
        tools = []
        for name in ("terraform", "packer", "aws"):
            matches = [pathlib.Path(d) / name for d in directories if os.access(pathlib.Path(d) / name, os.X_OK)]
            if len(matches) != 1:
                raise SystemExit("Terraform runtime requires one immutable executable for " + name)
            tool = matches[0].resolve(strict=True)
            if not str(tool).startswith("/nix/store/"):
                raise SystemExit("Terraform runtime tool escaped immutable storage")
            tools.append(str(tool))
        # No provider request or credential/bootstrap command occurs here.
        script = r'''
        set -euo pipefail
        export CHECKPOINT_DISABLE=1
        for tool in terraform packer aws; do command -v "$tool" >/dev/null; done
        test "$(readlink -f "$(command -v terraform)")" = "$1"
        test "$(readlink -f "$(command -v packer)")" = "$2"
        test "$(readlink -f "$(command -v aws)")" = "$3"
        test "$(readlink -f "$OURO_TERRAFORM_BIN")" = "$1"
        version_json="$(terraform version -json)"
        test "$(printf "%s" "$version_json" | jq -er .terraform_version)" = "$OURO_TERRAFORM_VERSION"
        test "$(printf "%s" "$version_json" | jq -er .platform)" = "$OURO_TERRAFORM_PLATFORM"
        test "$(sha256sum "$OURO_TERRAFORM_BIN" | cut -d " " -f1)" = "$OURO_TERRAFORM_SHA256"
        test "$(packer version)" = "Packer v1.11.2"
        aws --version | grep -E '^aws-cli/2[.]27[.]2 ' >/dev/null
        '''
        result = subprocess.run([str(wrapper), "--", "bash", "-c", script, "terraform-readiness", *tools], check=False)
        raise SystemExit(result.returncode)
        PYTOOLS
    - name: codex-version
      command: codex --version | grep -q '0.160.0'
    - name: terraform-config-profile
      command: |
        # Preparation already verifies and projects the fixed GUI record. This
        # check consumes that same public selection, not a Product MCP template.
        python3 - <<'PYPROFILE'
        import hashlib
        import json
        import os
        import pathlib
        import re
        import stat

        def refuse(message):
            raise SystemExit("Terraform profile readiness: " + message)

        manifest = pathlib.Path("/run/current-system/etc/fleet/source/codex-config-projections.json")
        data = json.loads(manifest.read_bytes())
        if data.get("schemaVersion") != "devkit/gui-codex-config-projections/v1":
            refuse("wrong immutable projection schema")
        records = [r for r in data.get("projections", []) if r.get("targetId") == "terraform-ouro-1"]
        if len(records) != 1:
            refuse("missing or duplicate TF1 projection")
        selected = records[0]
        expected = {
            "targetId": "terraform-ouro-1", "configProfile": "terraform",
            "kind": "devkit-agent", "expectedExecutionHost": "shadow-throne",
            "project": "ouroboros-terraform", "repo": "ouroboros-terraform", "agentIndex": 1,
            "workspaceRoot": "/home/bayesartre/dev/control-plane-worktrees/terraform-ouro-1",
            "hostWorktree": "/home/bayesartre/dev/control-plane-worktrees/terraform-ouro-1/ouroboros-terraform",
            "hostHome": "/home/bayesartre/dev/.devkit/native-agents/ouroboros-terraform-agent1/home",
        }
        if any(selected.get(key) != value for key, value in expected.items()):
            refuse("foreign Terraform profile or target geometry")
        if os.getcwd() != "/workspaces/dev/ouroboros-terraform":
            refuse("foreign sandbox worktree")
        raw_source = selected.get("source", "")
        source = pathlib.Path(raw_source)
        digest = selected.get("sourceSha256", "")
        if not raw_source.startswith("/nix/store/") or raw_source != os.path.normpath(raw_source) or not re.fullmatch(r"[0-9a-f]{64}", digest):
            refuse("noncanonical immutable source binding")
        config = pathlib.Path(os.environ["CODEX_HOME"]) / "config.toml"
        if source.resolve(strict=True) != source:
            refuse("redirected immutable source")

        def refuse_owner(path, info, immutable_source):
            # Only public filesystem/namespace metadata: never config/auth bytes.
            def metadata(candidate):
                try:
                    value = candidate.lstat()
                    return {"path": str(candidate), "uid": value.st_uid, "gid": value.st_gid,
                            "mode": oct(stat.S_IMODE(value.st_mode)),
                            "symlink": stat.S_ISLNK(value.st_mode),
                            "readOnlyFilesystem": bool(os.statvfs(candidate).f_flag & os.ST_RDONLY)}
                except OSError as error:
                    return {"path": str(candidate), "errno": error.errno}

            def namespace_map(name):
                try:
                    with open("/proc/self/" + name, "r") as stream:
                        return stream.read(8192)
                except OSError as error:
                    return {"errno": error.errno}

            evidence = {
                "schema": "devkit/tf-profile-ownership-refusal/v1",
                "failedFileClass": "immutable-source" if immutable_source else "projected-config",
                "failedOpenedFile": {"path": str(path), "uid": info.st_uid, "gid": info.st_gid,
                                     "mode": oct(stat.S_IMODE(info.st_mode))},
                "checker": {"euid": os.geteuid(), "egid": os.getegid(),
                            "uidMap": namespace_map("uid_map"), "gidMap": namespace_map("gid_map")},
                "home": os.environ.get("HOME"), "codexHome": os.environ.get("CODEX_HOME"),
                "store": metadata(pathlib.Path("/nix/store")),
                "source": metadata(source), "projection": metadata(config),
                "declaredSourceSha256": digest,
                "fileContentsReadForDiagnostic": False,
            }
            refuse("foreign source or projected file owner; ownership_readback=" + json.dumps(evidence, sort_keys=True))

        def read_regular(path, immutable_source=False):
            fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW)
            with os.fdopen(fd, "rb") as stream:
                info = os.fstat(stream.fileno())
                if not stat.S_ISREG(info.st_mode):
                    refuse("special source or projected file")
                if info.st_uid != os.geteuid() and not (immutable_source and info.st_uid == 0):
                    refuse_owner(path, info, immutable_source)
                if not immutable_source and stat.S_IMODE(info.st_mode) != 0o600:
                    refuse("unsafe projected config mode")
                return stream.read()

        source_bytes = read_regular(source, immutable_source=True)
        if hashlib.sha256(source_bytes).hexdigest() != digest:
            refuse("immutable source digest mismatch")
        if read_regular(config) != source_bytes:
            refuse("projected config differs from declared source")
        if b'# fleet_config_profile = "terraform"' not in source_bytes or b'[profiles.openai]' not in source_bytes:
            refuse("source is not the declared Terraform profile")
        if b'[mcp_servers.governance]' in source_bytes:
            refuse("Product governance profile substituted for Terraform")
        # Required support projections remain mandatory even though this profile
        # correctly contains no Product governance MCP table.
        support = pathlib.Path("/workspaces/dev/.devkit")
        for name in ("ouro8-governance-env.sh", "ouro8-governance-repo-env.json"):
            if not (support / name).is_file():
                refuse("missing required public lane support")
        if b'ouroboros-terraform=/workspaces/dev/ouroboros-terraform' not in (support / "ouro8-governance-env.sh").read_bytes():
            refuse("foreign public lane support")
        PYPROFILE
    - name: codex-auth-present
      command: |
        set -euo pipefail
        auth="${CODEX_HOME:-$HOME/.codex}/auth.json"
        test -r "$auth" || {
          echo "ouroboros-terraform readiness: missing Codex auth at $auth" >&2
          exit 1
        }
        python3 - "$auth" <<'PY'
        import json
        import sys

        auth_path = sys.argv[1]
        try:
            with open(auth_path, "r", encoding="utf-8") as fh:
                data = json.load(fh)
        except Exception as exc:
            print(f"ouroboros-terraform readiness: invalid Codex auth in {auth_path}: {exc}", file=sys.stderr)
            sys.exit(1)
        tokens = data.get("tokens") or {}
        if not (tokens.get("refresh_token") or data.get("OPENAI_API_KEY")):
            print(f"ouroboros-terraform readiness: Codex auth has no refresh token or API key in {auth_path}", file=sys.stderr)
            sys.exit(1)
        PY
  repo_checks:
    - name: aws-profile
      command: |
        test -n "${AWS_CONFIG_FILE:-}"
        test -f "$AWS_CONFIG_FILE"
        grep -q '^\[profile ouroboros\]' "$AWS_CONFIG_FILE"
    - name: core-check
      command: terraform fmt -check -recursive
broker:
  socket: .devkit/native-broker/broker.sock
  upstream: unix:///var/run/docker.sock
  # Native runtime-only preparation uses the unchanged shared station policy.
  # SAM container builds require a separate canonical capability judgment.
  allowed_images:
    - postgres:latest
    - testcontainers/ryuk:0.7.0
  allow_pulls: true
  log_level: info
env:
  AWS_PROFILE: ouroboros
  PATH: /workspace/.local/bin:${PATH}
hooks:
  warm: |
    set -euo pipefail

    mkdir -p /workspace/.local/bin

    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi

    for tool in aws terraform packer codex; do
      if ! command -v "$tool" >/dev/null 2>&1; then
        echo "Expected $tool from the ouroboros-terraform Nix runtime, but it was not on PATH." >&2
        echo "Use nix develop --output-lock-file /dev/null ./overlays/ouroboros-terraform#default or repair the repo-owned flake." >&2
        exit 1
      fi
    done

    if [ -z "${AWS_CONFIG_FILE:-}" ] || [ ! -f "${AWS_CONFIG_FILE}" ]; then
      echo "Expected AWS config file not found at AWS_CONFIG_FILE='${AWS_CONFIG_FILE:-<unset>}'." >&2
      echo "Mount or create ~/.aws/config on the host and include [profile ouroboros]." >&2
      exit 1
    fi

    if ! grep -q '^\[profile ouroboros\]' "${AWS_CONFIG_FILE}"; then
      echo "Expected [profile ouroboros] in ${AWS_CONFIG_FILE}." >&2
      echo "Run aws configure sso --profile ouroboros on the host if missing." >&2
      exit 1
    fi
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi

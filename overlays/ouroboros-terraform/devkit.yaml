workspace: ../../../ouroboros-terraform
service: dev-agent
defaults:
  repo: ouroboros-terraform
  agents: 1
  base_branch: main
  branch_prefix: agent
runtime:
  flake: ./overlays/ouroboros-terraform#default
  flake_input_overrides:
    ouroboros-terraform: ../ouroboros-terraform
  codex_version: 0.139.0
  core_check: terraform fmt -check -recursive
  notes: Thin devkit adapter; canonical tool requirements live in ../ouroboros-terraform/flake.nix and devkit.yaml, and devkit must pass the ouroboros-terraform flake input override explicitly.
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker terraform packer aws codex; do
          command -v "$tool" >/dev/null
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: terraform-packer-aws
      command: terraform version >/dev/null && packer version >/dev/null && aws --version >/dev/null
    - name: codex-version
      command: codex --version | grep -q '0.139.0'
    - name: governance-mcp-config
      command: |
        set -euo pipefail
        config="${CODEX_HOME:-$HOME/.codex}/config.toml"
        expected_cwd="$(pwd -P)"
        require_config() {
          if ! grep -Fq "$1" "$config"; then
            echo "ouroboros-terraform readiness: Codex governance config missing $1 in $config" >&2
            exit 1
          fi
        }
        test -r "$config" || {
          echo "ouroboros-terraform readiness: missing Codex config at $config" >&2
          exit 1
        }
        require_config '# source = nixos-wsl codex config'
        require_config '[model_providers.custom]'
        require_config '[profiles.custom]'
        require_config 'model_provider = "custom"'
        require_config '# BEGIN DEVKIT NATIVE GOVERNANCE MCP'
        require_config '[mcp_servers.governance]'
        require_config 'command = "/run/current-system/sw/bin/bash"'
        require_config "cwd = \"$expected_cwd\""
        require_config 'DEVKIT_GOVERNANCE_MCP_ENTRYPOINT_SHA256='
        require_config 'governance.workspace_topology'
        test -r /workspaces/dev/.devkit/ouro8-governance-env.sh
        grep -Fq 'ouroboros-terraform=/workspaces/dev/ouroboros-terraform' /workspaces/dev/.devkit/ouro8-governance-env.sh
    - name: codex-auth-scopes
      command: |
        set -euo pipefail
        auth="${CODEX_HOME:-$HOME/.codex}/auth.json"
        test -r "$auth" || {
          echo "ouroboros-terraform readiness: missing Codex auth at $auth" >&2
          exit 1
        }
        python3 - "$auth" <<'PY'
        import base64
        import json
        import sys

        auth_path = sys.argv[1]
        required = {"api.model.read", "api.responses.write"}
        try:
            with open(auth_path, "r", encoding="utf-8") as fh:
                data = json.load(fh)
            token = data.get("tokens", {}).get("access_token", "")
            payload = token.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            claims = json.loads(base64.urlsafe_b64decode(payload))
        except Exception as exc:
            print(f"ouroboros-terraform readiness: invalid Codex auth token in {auth_path}: {exc}", file=sys.stderr)
            sys.exit(1)
        scope_claim = claims.get("scp") or claims.get("scope") or []
        if isinstance(scope_claim, str):
            scopes = set(scope_claim.split())
        else:
            scopes = set(scope_claim)
        missing = sorted(required - scopes)
        if missing:
            got = ", ".join(sorted(scopes)) or "<none>"
            print(
                "ouroboros-terraform readiness: Codex auth token is missing required scope(s) "
                + ", ".join(missing)
                + f" in {auth_path}; present scopes: {got}",
                file=sys.stderr,
            )
            sys.exit(1)
        PY
  repo_checks:
    - name: aws-profile
      command: |
        test -n "${AWS_CONFIG_FILE:-}"
        test -f "$AWS_CONFIG_FILE"
        grep -q '^\[profile ouroboros\]' "$AWS_CONFIG_FILE"
    - name: core-check
      command: terraform fmt -check -recursive
broker:
  socket: ../.devkit/native-broker/broker.sock
  upstream: unix:///var/run/docker.sock
  allowed_images:
    - postgres:latest
  allow_pulls: true
  log_level: info
env:
  AWS_PROFILE: ouroboros
  PATH: /workspace/.local/bin:${PATH}
hooks:
  warm: |
    set -euo pipefail

    mkdir -p /workspace/.local/bin

    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi

    for tool in aws terraform packer codex; do
      if ! command -v "$tool" >/dev/null 2>&1; then
        echo "Expected $tool from the ouroboros-terraform Nix runtime, but it was not on PATH." >&2
        echo "Use nix develop ./overlays/ouroboros-terraform#default or repair the repo-owned flake." >&2
        exit 1
      fi
    done

    if [ -z "${AWS_CONFIG_FILE:-}" ] || [ ! -f "${AWS_CONFIG_FILE}" ]; then
      echo "Expected AWS config file not found at AWS_CONFIG_FILE='${AWS_CONFIG_FILE:-<unset>}'." >&2
      echo "Mount or create ~/.aws/config on the host and include [profile ouroboros]." >&2
      exit 1
    fi

    if ! grep -q '^\[profile ouroboros\]' "${AWS_CONFIG_FILE}"; then
      echo "Expected [profile ouroboros] in ${AWS_CONFIG_FILE}." >&2
      echo "Run aws configure sso --profile ouroboros on the host if missing." >&2
      exit 1
    fi
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi

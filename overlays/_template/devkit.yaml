# Path to the repository to mount at /workspace. Relative paths resolve from this file.
workspace: ../../path-to-your-repo
service: app

defaults:
  repo: your-repo-name
  agents: 1
  base_branch: main
  branch_prefix: agent

runtime:
  flake: "./overlays/_template#default"
  codex_version: 0.142.5
  core_check: echo "replace runtime.core_check with your repo validation command"
  notes: Template Nix runtime for new overlays.

readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker codex python3 uv; do
          command -v "$tool" >/dev/null
        done
    - name: docker-client
      command: docker --version >/dev/null
  repo_checks:
    - name: core-check
      command: echo "replace runtime.core_check with your repo validation command"

# Optional: environment exported before native commands
env: {}

# Optional: additional env files (relative paths resolve from this directory)
env_files: []

# Optional hooks executed inside the native sandbox
hooks:
  warm: ""
  maintain: ""

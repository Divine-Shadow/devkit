defaults:
  # How many agents to start for reset/bootstrap when count not provided
  agents: 3
  # Primary repo name under the dev root to set up with worktrees
  repo: ouroboros-ide
  # Ordinary writable-checkout creation uses this declared SSH origin and
  # never infers a remote from an ambient checkout.
  origin: ssh://git@ssh.github.com:443/Divine-Shadow/ouroboros-ide.git
  # The base branch each per-agent branch should track from origin
  base_branch: main
  # Prefix for per-agent branch names (agent1, agent2, ...)
  branch_prefix: agent
  # Run native readiness after up/restart/scale.
  auto_ready: true
  # Warm hook is required for readiness.
  require_warm: true
runtime:
  flake: path:.?dir=overlays/dev-all#default
  codex_version: 0.144.0
  core_check: bash scripts/sbt2 "Compile / compile"
  notes: Canonical multi-worktree runtime for ouroboros-ide.
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker go java sbt node npm purs spago vite netlify playwright deno aws make gcc mgba-headless; do
          command -v "$tool" >/dev/null || { echo "missing required runtime tool: $tool" >&2; exit 127; }
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: purescript-spago-netlify
      command: purs --version >/dev/null && spago --version >/dev/null && vite --version >/dev/null && netlify --version >/dev/null && deno --version >/dev/null
    - name: playwright-browser
      command: |
        node <<'NODE'
        const { chromium } = require("@playwright/test");
        (async () => {
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.setContent("<title>native-playwright-ok</title>");
          const title = await page.title();
          await browser.close();
          if (title !== "native-playwright-ok") {
            throw new Error(`unexpected title: ${title}`);
          }
        })().catch((err) => {
          console.error(err);
          process.exit(1);
        });
        NODE
    - name: codex-provider-config
      command: |
        set -euo pipefail
        config="${CODEX_HOME:-$HOME/.codex}/config.toml"
        test -r "$config" || {
          echo "dev-all readiness: missing Codex config at $config" >&2
          exit 1
        }
        grep -Fqx '# source = nixos-wsl codex config' "$config" || {
          echo "dev-all readiness: Codex config is not Nix-authored: $config" >&2
          exit 1
        }
        grep -Fqx 'model_provider = "openai"' "$config" || {
          echo "dev-all readiness: Codex config must use model_provider = \"openai\": $config" >&2
          exit 1
        }
        grep -Fqx '[profiles.openai]' "$config" || {
          echo "dev-all readiness: Codex config missing [profiles.openai]: $config" >&2
          exit 1
        }
  repo_checks:
    - name: git-remote
      command: test -n "$(git config --worktree --get core.sshCommand)" && GIT_CONFIG_NOSYSTEM=1 git ls-remote --heads origin >/dev/null
    - name: frontend-warm
      command: |
        if [ -f frontend/package.json ]; then
          npm --prefix frontend ci --include=dev --ignore-scripts
          ln -sf "$(command -v purs)" frontend/node_modules/.bin/purs
          npm --prefix frontend rebuild better-sqlite3 --build-from-source
          test -x frontend/node_modules/.bin/tsc
          npm --prefix frontend ls @playwright/test global-agent --depth=0 >/dev/null
        fi
    - name: frontend-playwright-browser
      command: |
        test -f frontend/package.json
        cd frontend
        node <<'NODE'
        const { chromium } = require("@playwright/test");
        (async () => {
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.setContent("<title>frontend-playwright-ok</title>");
          const title = await page.title();
          await browser.close();
          if (title !== "frontend-playwright-ok") {
            throw new Error(`unexpected title: ${title}`);
          }
        })().catch((err) => {
          console.error(err);
          process.exit(1);
        });
        NODE
    - name: frontend-netlify-dev-server
      command: |
        test -f frontend/netlify.toml
        cd frontend
        agent_dir="$(basename "$(dirname "$HOME")")"
        agent_index="$(printf '%s' "$agent_dir" | sed -n 's/.*agent\([0-9][0-9]*\)$/\1/p')"
        if [ -z "$agent_index" ]; then
          agent_index=1
        fi
        port=$((45173 + agent_index))
        target_port=$((46173 + agent_index))
        log="$(mktemp)"
        had_netlify_dir=0
        if [ -e .netlify ]; then
          had_netlify_dir=1
        fi
        cleanup() {
          code="$?"
          pkill -TERM -P "$pid" >/dev/null 2>&1 || true
          kill "$pid" >/dev/null 2>&1 || true
          pkill -TERM -f "vite .*--port $target_port" >/dev/null 2>&1 || true
          pkill -TERM -f "npm run dev .*--port $target_port" >/dev/null 2>&1 || true
          wait "$pid" >/dev/null 2>&1 || true
          if [ "$had_netlify_dir" = 0 ]; then
            rm -rf .netlify
          fi
          if [ "$code" -ne 0 ]; then
            cat "$log" >&2 || true
          fi
          rm -f "$log" /tmp/devkit-netlify-dev-index.html
          exit "$code"
        }
        NETLIFY_TELEMETRY_DISABLED=1 BROWSER=none netlify dev \
          --offline \
          --no-open \
          --skip-gitignore \
          --port "$port" \
          --target-port "$target_port" \
          --command "npm run dev -- --host 127.0.0.1 --port $target_port" \
          >"$log" 2>&1 &
        pid="$!"
        trap cleanup EXIT
        for _ in $(seq 1 120); do
          if curl -fsS "http://127.0.0.1:$port/" >/tmp/devkit-netlify-dev-index.html 2>/dev/null; then
            grep -Eiq '<!doctype html|<html|<div id="root"' /tmp/devkit-netlify-dev-index.html
            exit 0
          fi
          kill -0 "$pid" >/dev/null 2>&1
          sleep 1
        done
        echo "timed out waiting for netlify dev on port $port" >&2
        exit 1
    - name: frontend-purescript-build
      command: |
        test -f frontend/package.json
        npm --prefix frontend run ps:build
    - name: frontend-typecheck
      command: |
        test -f frontend/package.json
        npm --prefix frontend run typecheck
    - name: static-marketing-fixture-typecheck
      command: |
        static_repo=/workspaces/dev/ouroboros-static-front-end
        test -f "$static_repo/package.json"
        npm --prefix "$static_repo" run typecheck
    - name: static-marketing-fixture-smoke
      command: |
        static_repo=/workspaces/dev/ouroboros-static-front-end
        test -f "$static_repo/package.json"
        (
          cd "$static_repo"
          SMOKE_TEST_PORT=$((9010 + ${DEVKIT_NATIVE_AGENT:-0})) \
          XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-/tmp/devkit-static-gatsby-config-${DEVKIT_NATIVE_AGENT:-0}}" \
          USE_CONTENTFUL_FIXTURE=1 \
          GATSBY_TELEMETRY_DISABLED=1 \
          npm run smoke
        )
    - name: frontend-test
      command: |
        test -f frontend/package.json
        npm --prefix frontend run test:raw
    - name: core-check
      command: bash scripts/sbt2 "Compile / compile"
broker:
  socket: .devkit/native-broker/broker.sock
  upstream: unix:///var/run/docker.sock
  allowed_images:
    - postgres:latest
    - testcontainers/ryuk:0.7.0
  allow_pulls: true
  log_level: info
native:
  # Mutable geometry is explicit because the installed controller executes
  # from an immutable /nix/store package, not a writable Devkit checkout.
  host_root: /home/bayesartre/dev
  worktree_root: /home/bayesartre/dev/agent-worktrees
  state_root: /home/bayesartre/dev/.devkit/native-agents
  worktree_container_root: /workspaces/dev/agent-worktrees
  state_container_root: /agent-state
  required_isolation_profile: workspace-egress
  isolation_profiles:
    workspace-egress:
      filesystem: workspace-only
      egress_allowlist: ../../kit/proxy/allowlist.txt
ingress:
  kind: caddy

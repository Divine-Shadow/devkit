defaults:
  # How many agents to start for reset/bootstrap when count not provided
  agents: 3
  # Primary repo name under the dev root to set up with worktrees
  repo: ouroboros-ide
  # The base branch each per-agent branch should track from origin
  base_branch: main
  # Prefix for per-agent branch names (agent1, agent2, ...)
  branch_prefix: agent
  # Run readiness (ssh + warm + validation) after up/restart/scale.
  auto_ready: true
  # Warm hook is required for readiness.
  require_warm: true
runtime:
  image: local/dev-agent:ouroboros-ide
  codex_version: 0.130.0
  core_check: scripts/sbt2 "Compile / compile"
  notes: Canonical multi-worktree runtime for ouroboros-ide.
readiness:
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker go node npm spago netlify playwright; do
          command -v "$tool" >/dev/null
        done
    - name: spago-netlify
      command: spago --version >/dev/null && netlify --version >/dev/null
    - name: playwright-browser
      command: |
        node <<'NODE'
        const { chromium } = require("@playwright/test");
        (async () => {
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          await page.setContent("<title>native-playwright-ok</title>");
          const title = await page.title();
          await browser.close();
          if (title !== "native-playwright-ok") {
            throw new Error(`unexpected title: ${title}`);
          }
        })().catch((err) => {
          console.error(err);
          process.exit(1);
        });
        NODE
  repo_checks:
    - name: git-remote
      command: git ls-remote --heads origin >/dev/null
    - name: frontend-warm
      command: |
        if [ -f frontend/package.json ]; then
          npm --prefix frontend ci --include=dev --ignore-scripts
        fi
    - name: frontend-playwright-browser
      command: |
        test -f frontend/package.json
        (
          cd frontend
          node <<'NODE'
          const { chromium } = require("@playwright/test");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.setContent("<title>frontend-playwright-ok</title>");
            const title = await page.title();
            await browser.close();
            if (title !== "frontend-playwright-ok") {
              throw new Error(`unexpected title: ${title}`);
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
        )
    - name: frontend-typecheck
      command: |
        test -f frontend/package.json
        npm --prefix frontend run typecheck
    - name: frontend-test
      command: |
        test -f frontend/package.json
        npm --prefix frontend run test:raw
    - name: core-check
      command: scripts/sbt2 "Compile / compile"
broker:
  socket: /run/devkit/test-container-broker.sock
  upstream: unix:///var/run/docker.sock
  allowed_images:
    - postgres:latest
  allow_pulls: true
  log_level: info
native:
  worktree_root: ../agent-worktrees
  state_root: ../.devkit/native-agents
  worktree_container_root: /worktrees
  state_container_root: /agent-state

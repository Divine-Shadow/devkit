hooks:
  # Warm frontend deps and ensure playwright/typecheck tooling exists.
  warm: |
    set -euo pipefail
    canonical_ouro_repos() {
      printf '%s\n' /workspaces/dev/ouroboros-ide
      if [ -n "${DEVKIT_NATIVE_AGENT:-}" ]; then
        printf '%s\n' "/workspaces/dev/agent-worktrees/agent${DEVKIT_NATIVE_AGENT}/ouroboros-ide"
        return 0
      fi
      local index
      for index in 1 2 3 4 5 6 7 8; do
        printf '%s\n' "/workspaces/dev/agent-worktrees/agent${index}/ouroboros-ide"
      done
    }
    cleanup_governance_logs() {
      local ttl="${OURO_LOG_TTL_DAYS:-7}"
      if ! printf '%s' "$ttl" | grep -Eq '^[0-9]+$'; then
        echo "[dev-all warm] invalid OURO_LOG_TTL_DAYS=$ttl, skipping log cleanup" >&2
        return 0
      fi

      canonical_ouro_repos | while IFS= read -r repo; do
        [ -d "$repo/logs" ] || continue
        if [ -x "$repo/scripts/devops/governance-retention-cleanup" ]; then
          "$repo/scripts/devops/governance-retention-cleanup" --root "$repo/logs" --ttl-days "$ttl"
        else
          find "$repo/logs" -path "$repo/logs/plans" -prune -o -type f -mtime +"$ttl" -delete
        fi
      done
    }
    install_governed_search_policy_rules() {
      local source=/workspaces/dev/devkit/overlays/dev-all/codex-governed-search-policy.rules
      local target
      [ -r "$source" ] || return 0

      for home in \
        /workspaces/dev/ouroboros-ide/.devhome-agent1 \
        /workspaces/dev/agent-worktrees/agent[0-9]*/.devhome-agent[0-9]* \
        /workspaces/dev/.devkit/native-agents/dev-all-agent[0-9]*/home; do
        [ -d "$home" ] || continue
        target="$home/.codex/rules/governed-search-policy.rules"
        mkdir -p "$(dirname "$target")"
        cp -f "$source" "$target"
      done
    }
    cleanup_governance_logs
    install_governed_search_policy_rules
    # Keep a compatibility path for workflows that expect agent1 under agent-worktrees.
    mkdir -p /workspaces/dev/agent-worktrees/agent1
    if [ -d /workspaces/dev/ouroboros-ide ] && [ ! -e /workspaces/dev/agent-worktrees/agent1/ouroboros-ide ]; then
      ln -s ../../ouroboros-ide /workspaces/dev/agent-worktrees/agent1/ouroboros-ide
    fi
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
  maintain: ""

env_files:
  - ../shared/env/dev-all.env

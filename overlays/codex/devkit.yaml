workspace: ../../../ouroboros-ide
service: dev-agent
defaults:
  repo: ouroboros-ide
  agents: 1
  base_branch: main
  branch_prefix: agent
runtime:
  # Legacy single-checkout overlay kept for image builds and direct debugging.
  # dev-all is the canonical ouroboros-ide runtime pairing.
  canonical: false
  flake: ./overlays/codex#default
  codex_version: 0.152.1
  core_check: scripts/sbt2 "Compile / compile"
readiness:
  default_mode: runtime-only
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker go java sbt node npm purs spago vite netlify deno playwright; do
          command -v "$tool" >/dev/null || { echo "missing required runtime tool: $tool" >&2; exit 127; }
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: purescript-spago-netlify
      command: purs --version >/dev/null && spago --version >/dev/null && vite --version >/dev/null && netlify --version >/dev/null && deno --version >/dev/null
    - name: playwright-cli
      command: playwright --version >/dev/null && node -e 'require("@playwright/test")'
    - name: sbt-jvm
      command: java -version >/dev/null 2>&1 && command -v sbt >/dev/null
  repo_checks:
    - name: core-check
      command: scripts/sbt2 "Compile / compile"
env:
  AWS_PROFILE: codex
  PATH: /workspace/.local/bin:${PATH}
ingress:
  kind: caddy
  routes:
    - host: ouroboros.test
      service: dev-agent
      port: 5173
      cert: ../../../ouroboros-ide/infra/ouroboros.test.pem
      key: ../../../ouroboros-ide/infra/ouroboros.test-key.pem

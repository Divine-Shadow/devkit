hooks:
  warm: |
    set -euo pipefail
    find_purs_bin() {
      local candidate
      if command -v purs >/dev/null 2>&1; then
        command -v purs
        return 0
      fi
      for candidate in /nix/store/*-purescript-*/bin/purs /nix/store/*purescript*/bin/purs; do
        if [ -x "$candidate" ]; then
          printf '%s\n' "$candidate"
          return 0
        fi
      done
      return 1
    }
    if command -v npm >/dev/null 2>&1; then
      for repo in /workspace /workspaces/dev/ouroboros-ide /workspaces/dev/agent-worktrees/agent[0-9]*/ouroboros-ide; do
        if [ -f "$repo/frontend/package.json" ]; then
          if [ -f "$repo/frontend/package-lock.json" ]; then
            npm --prefix "$repo/frontend" ci --include=dev --ignore-scripts
          else
            npm --prefix "$repo/frontend" install --include=dev --ignore-scripts
          fi
          if npm --prefix "$repo/frontend" ls purescript --depth=0 >/dev/null 2>&1; then
            purs_bin="$(find_purs_bin)" || {
              echo "[codex warm] purescript package is installed but no Nix purs binary is available" >&2
              exit 1
            }
            ln -sf "$purs_bin" "$repo/frontend/node_modules/.bin/purs"
          fi
          npm --prefix "$repo/frontend" rebuild better-sqlite3 --build-from-source
          test -x "$repo/frontend/node_modules/.bin/tsc"
          npm --prefix "$repo/frontend" ls @playwright/test global-agent --depth=0 >/dev/null
        fi
      done
    fi
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    host=$(hostname)
    base=/workspace/.devhomes
    target="${base}/${host}"
    mkdir -p "${target}/.ssh" "${target}/.cache" "${target}/.config" "${target}/.local" "${target}/.sbt"
    chmod 700 "${target}/.ssh"
    ln -sfn "${target}" /workspace/.devhome
    if [ -d /home/dev/.ivy2 ]; then ln -sfn /home/dev/.ivy2 "${target}/.ivy2"; fi
    mkdir -p "${target}/.cache"
    if [ -d /home/dev/.cache/coursier ]; then ln -sfn /home/dev/.cache/coursier "${target}/.cache/coursier"; fi
    if [ -e /home/dev/.sbt ] || [ -L /home/dev/.sbt ]; then rm -rf /home/dev/.sbt; fi
    ln -sfn "${target}/.sbt" /home/dev/.sbt
    export HOME=/workspace/.devhome
    export SBT_GLOBAL_BASE="${HOME}/.sbt"
    sbt -v update
  maintain: |
    set -euo pipefail
    mkdir -p /workspace/.local/bin
    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi
    host=$(hostname)
    base=/workspace/.devhomes
    target="${base}/${host}"
    mkdir -p "${target}/.ssh" "${target}/.cache" "${target}/.config" "${target}/.local" "${target}/.sbt"
    chmod 700 "${target}/.ssh"
    ln -sfn "${target}" /workspace/.devhome
    if [ -d /home/dev/.ivy2 ]; then ln -sfn /home/dev/.ivy2 "${target}/.ivy2"; fi
    mkdir -p "${target}/.cache"
    if [ -d /home/dev/.cache/coursier ]; then ln -sfn /home/dev/.cache/coursier "${target}/.cache/coursier"; fi
    if [ -e /home/dev/.sbt ] || [ -L /home/dev/.sbt ]; then rm -rf /home/dev/.sbt; fi
    ln -sfn "${target}/.sbt" /home/dev/.sbt
    export HOME=/workspace/.devhome
    export SBT_GLOBAL_BASE="${HOME}/.sbt"
    sbt compile

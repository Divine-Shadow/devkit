services:
  dev-agent:
    image: local/dev-agent:codex
    build:
      # Path is relative to devkit/kit/compose.yml.
      context: ../../ouroboros-ide
      dockerfile: infra/docker/dev/codex-agent.Dockerfile
      args:
        JDK_VERSION: ${DEVKIT_JDK_VERSION:-17}
    environment:
      - VITE_STUB_CLIENTS=${VITE_STUB_CLIENTS:-0}
      - RUN_LOCAL_SKIP_COMPILE=${RUN_LOCAL_SKIP_COMPILE:-0}
      - RUN_LOCAL_BACKEND_MAIN=${DEVKIT_BACKEND_MAIN:-}
      - DOCKER_HOST=${DEVKIT_DOCKER_HOST:-}
      - TESTCONTAINERS_RYUK_DISABLED=${DEVKIT_TESTCONTAINERS_RYUK_DISABLED:-true}
      - LOCAL_AURORA_CREDENTIALS_PATH=${DEVKIT_AURORA_CREDENTIALS_PATH:-local-secrets/aurora.json}
      - RUN_LOCAL_FORCE_JAR=${DEVKIT_FORCE_RUN_LOCAL_JAR:-}
      - LOCAL_POSTGRES_HOST=${DEVKIT_POSTGRES_HOST:-devkit-postgres}
      - LOCAL_POSTGRES_PORT=${DEVKIT_POSTGRES_PORT:-5432}
      - LOCAL_POSTGRES_USER=${DEVKIT_POSTGRES_USER:-ouroboros}
      - LOCAL_POSTGRES_PASSWORD=${DEVKIT_POSTGRES_PASSWORD:-ouroboros}
      - LOCAL_POSTGRES_DB=${DEVKIT_POSTGRES_DB:-ouroboros}
      - JAVA_TOOL_OPTIONS=-Dhttp.proxyHost=tinyproxy -Dhttp.proxyPort=8888 -Dhttps.proxyHost=tinyproxy -Dhttps.proxyPort=8888 -Djava.net.useSystemProxies=true
    volumes:
      - broker-run:/broker-run

  postgres-broker:
    profiles:
      - postgres-broker
    build:
      context: ../brokers/postgres-broker
      dockerfile: Dockerfile
    image: devkit/postgres-broker:dev
    user: "0:0"
    environment:
      - BROKER_LISTEN=unix:///broker-run/postgres-broker.sock
      - BROKER_UPSTREAM=/var/run/docker.sock
      - BROKER_ALLOWED_IMAGES=${BROKER_ALLOWED_IMAGES:-postgres:latest,minio/minio:latest}
      - BROKER_ALLOWED_IMAGE=${BROKER_ALLOWED_IMAGE:-postgres}
      - BROKER_ALLOWED_TAG=${BROKER_ALLOWED_TAG:-latest}
      - BROKER_ALLOW_PULLS=${BROKER_ALLOW_PULLS:-true}
      - BROKER_LOG_LEVEL=${BROKER_LOG_LEVEL:-info}
      - BROKER_ATTACH_NETWORKS=${BROKER_ATTACH_NETWORKS:-devkit_dev-internal}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - broker-run:/broker-run
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dev-internal

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=${DEVKIT_POSTGRES_USER:-ouroboros}
      - POSTGRES_PASSWORD=${DEVKIT_POSTGRES_PASSWORD:-ouroboros}
      - POSTGRES_DB=${DEVKIT_POSTGRES_DB:-ouroboros}
    ports:
      - ${DEVKIT_POSTGRES_HOST_PORT:-15432}:5432
    networks:
      dev-internal:
        aliases:
          - devkit-postgres

volumes:
  broker-run:

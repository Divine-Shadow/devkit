workspace: ../../../agent-worktrees/integration
service: dev-agent

defaults:
  repo: ouroboros-ide
  agents: 1
  base_branch: main
  branch_prefix: agent

runtime:
  canonical: false
  flake: .#ouro-integration
  codex_version: 0.130.0
  core_check: |
    (cd /workspaces/dev/ouroboros-terraform && terraform plan -input=false -no-color)
    (cd /workspaces/dev/ouroboros-ide && scripts/sbt2 "project backend" "assembly")
  notes: Integration runtime with the Ouroboros Scala toolchain plus Terraform/AWS tooling and dedicated integration worktrees mounted read-write.
readiness:
  runtime_checks:
    - name: required-tools
      command: |
        for tool in git ssh curl docker java sbt aws terraform packer node npm; do
          command -v "$tool" >/dev/null
        done
    - name: docker-client
      command: docker --version >/dev/null
    - name: terraform-packer-aws
      command: terraform version >/dev/null && packer version >/dev/null && aws --version >/dev/null
    - name: sbt-jvm
      command: java -version >/dev/null 2>&1 && command -v sbt >/dev/null
  repo_checks:
    - name: aws-config
      command: test -f /workspaces/dev/.aws/config
    - name: core-check
      command: |
        (cd /workspaces/dev/ouroboros-terraform && terraform plan -input=false -no-color)
        (cd /workspaces/dev/ouroboros-ide && scripts/sbt2 "project backend" "assembly")

env:
  AWS_PROFILE: codex

hooks:
  warm: |
    set -euo pipefail

    mkdir -p /workspaces/dev/.local/bin /workspace/.local/bin

    if command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
      ln -sf "$(command -v python3)" /workspaces/dev/.local/bin/python
      ln -sf "$(command -v python3)" /workspace/.local/bin/python
    fi

    if [ -f /workspaces/dev/.aws/config ]; then
      printf 'AWS config available at /workspaces/dev/.aws/config\n'
    else
      printf 'Expected AWS config at /workspaces/dev/.aws/config\n' >&2
      exit 1
    fi

    command -v aws >/dev/null
    command -v terraform >/dev/null
    command -v sbt >/dev/null
    command -v java >/dev/null
  maintain: ""
